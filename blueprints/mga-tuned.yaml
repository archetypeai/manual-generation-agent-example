# mga-tuned — Manual Generation with generation parameters and instruction exposed.
#
# WHY THIS EXISTS
#
# The canonical `mga` blueprint hardcodes two things that turn out to be the
# binding constraints on output quality, and neither can be overridden from a
# bundle. Both were verified empirically on dev, 2026-08-10:
#
#   1. GENERATION LENGTH. `nodes.fusion.config` is only `{model: ...}` — no
#      max_new_tokens. A 173 s video produced 6 steps / ~169 tokens, with the
#      final step cut mid-clause ("...and raise the car" — no terminal period,
#      while all 5 preceding steps end in one). 7 of 11 ground-truth steps got
#      zero coverage; 51% of the video produced no output at all.
#      Passing `values: {max_new_tokens: 1024}` to a bundle from the canonical
#      blueprint is ACCEPTED (HTTP 201) and echoed back in the bundle's values,
#      but has ZERO effect: two runs differing only by that value produced
#      BYTE-IDENTICAL output (md5 080e551a88f0bdcd857e48557366ae60, 1146 bytes).
#      An unreferenced value is stored and wired to nothing. `nodes` overrides
#      passed at bundle creation are silently DROPPED (201, absent from the
#      response) — so there is no client-side workaround at all.
#
#   2. THE INSTRUCTION. `connectors.source.config.default_text` is fixed, and
#      `text_extensions: []` disables text inputs, so no per-run instruction is
#      possible. This is also why the token budget is wasted: the fixed prompt
#      constrains step COUNT ("10 steps or less") but never step LENGTH, so the
#      model spends 13.8 words per step on prose and runs out of budget at 6 —
#      while being told it may use 10.
#
# Registering this blueprint requires the ADMIN role
# (POST /agents/blueprints -> 403 "blueprint creation requires the admin role").
# Like `red-fitting`, it is org-scoped (is_canonical: false), so it needs to be
# registered once per org before anyone can create bundles from it.
#
# UNVERIFIED — READ BEFORE REGISTERING
#
# The graph and every pre-existing value below are copied verbatim from the
# canonical `mga` document (blp_0zmce3qnjp8659dp1pszdqbtx4). What is NOT
# verified is the set of config keys `NewtonFusionModelNode` actually accepts.
# The names used here (max_new_tokens, temperature, top_k, top_p,
# repetition_penalty, enable_thinking) come from the manual-gen-jos batch app
# and its direct /query payloads — a DIFFERENT API against a different model
# (newton/c:2.5.1-8b-base), where they are first-class model parameters. There
# is no node-schema endpoint on the platform (GET /agents/nodes -> 404), so
# these could not be checked against the node itself.
#
# If registration or the first run fails on an unknown key, cut back to the
# minimal version: keep ONLY `max_new_tokens` on the fusion node and drop the
# other five. max_new_tokens alone addresses the truncation, which is the
# finding with hard evidence behind it.
#
# NOTE ON enable_thinking: if thinking tokens are counted against
# max_new_tokens, turning it on will REDUCE the steps that fit. It defaults to
# false here for that reason. Raise max_new_tokens substantially before
# enabling it.

blueprint_key: mga-tuned
name: Manual Generation (tuned)
description: >
  Manual Generation with generation parameters and the instruction exposed as
  bundle values. Same graph and output contract as canonical `mga`.

values:
  # ---------------------------------------------------------------------------
  # NEW — generation parameters. None of these exist in canonical `mga`.
  # ---------------------------------------------------------------------------
  # The fix for the truncation described above. 169 tokens were emitted before
  # being cut, consistent with a 256-token default. 1024 is the value used by
  # the manual-gen-jos config; that app uses 2048 for batch and 4096 for
  # /query, so raise this further if steps are still being cut off.
  max_new_tokens: 1024
  # 0.2 matches manual-gen-jos. Canonical `mga` output is deterministic across
  # runs (verified byte-identical), so the current effective setting is greedy
  # or near-zero temperature. Keep it low: a manual should be reproducible.
  temperature: 0.2
  repetition_penalty: 1.0
  top_k: null
  top_p: null
  # See the note above — thinking tokens may consume max_new_tokens.
  enable_thinking: false

  # ---------------------------------------------------------------------------
  # NEW — the instruction, previously hardcoded as connectors.source.default_text
  # ---------------------------------------------------------------------------
  # Changes from the canonical text ("Generate a concise, ordered list of
  # distinct steps with 10 steps or less"), each targeting an observed failure:
  #
  #   "from the beginning to the end"  -> the canonical run stopped at 85 s of a
  #                                       173 s video and never resumed.
  #   "at most 15 words"              -> caps per-step cost so the token budget
  #                                       covers the whole procedure instead of
  #                                       being spent on 6 verbose steps.
  #   "what is shown and what is said"-> manual-gen-jos found that vision-only
  #                                       framing SUPPRESSED audio on its model.
  #                                       MGA runs whisper into prompt.audio, so
  #                                       the transcript should be acknowledged.
  #   "do not invent"                 -> canonical output included two steps
  #                                       absent from the reference procedure.
  #
  # Keep this close in spirit to the canonical text. It is passed as the
  # `instruction` into ManualGenerationPromptGeneratorNode, which wraps it in
  # its own template — the one ManualGenerationResultsParserNode expects. A
  # wholesale replacement (e.g. asking for markdown) risks breaking the parser
  # and losing the structured frame/timestamp output, which is the main
  # advantage this pipeline has over the batch path.
  instruction: >
    Generate a concise, ordered list of the distinct steps performed in this
    video, covering the procedure from the beginning to the end of the
    recording. Use both what is shown and what is said. Keep each step to at
    most 15 words. Do not invent steps that are not shown or stated.

  # ---------------------------------------------------------------------------
  # Unchanged from canonical `mga` below this line.
  # ---------------------------------------------------------------------------
  # --- VideoReaderNode ---
  # Number of frames to uniformly sample across the video. `<= 0` keeps every
  # frame. Values 16/64/256/501/512/1024/-1 are all accepted at bundle creation
  # with no validation, so this is not a bound the API will enforce for you.
  # 64 is used here rather than 16: it is the reader/preprocessor batch size, so
  # the frames land in a single batch, and at a 173 s video it gives 2.7 s per
  # frame against a ~5 s mean step.
  max_frames: 64
  # Each frame resized to `size x size` (bilinear). Note this makes source
  # resolution nearly irrelevant — 640x360 and 1920x1080 both become 224x224.
  size: 224
  reader_batch_size: 64

  # --- VideoPreprocessorNode (all at canonical defaults) ---
  preprocessor_batch_size: 64
  preprocessor_batching_delay_ms: 200
  preprocessor_patch_size: 16
  preprocessor_merge_size: 2
  preprocessor_temporal_patch_size: 2
  preprocessor_image_mean: [0.5, 0.5, 0.5]
  preprocessor_image_std: [0.5, 0.5, 0.5]
  preprocessor_rescale_factor: 0.00392156862745098
  preprocessor_min_pixels: 4096
  # 24 Mi. At size=224 this permits 25165824/(224*224) = 501 frames, so it —
  # not max_frames — is the arithmetic ceiling on frame count in this config.
  preprocessor_max_pixels: 25165824

  # --- ManualGenerationResultsParserNode ---
  # Turned ON here (canonical default: false). It attaches template-conformance
  # stats under `result_parser_stats`, which is the direct way to see truncation
  # rather than inferring it from a missing terminal period.
  parser_compute_stats: true
  parser_output_frame_indices: true

models:
  fusion: "newton-fusion:1.0"
  whisper: "whisper:large-v3"

connectors:
  source:
    key: MultiModalSource
    config:
      # Kept empty as in canonical `mga`: a run's inputs are videos only, so a
      # stray text file cannot silently become the instruction for the whole
      # run. The instruction comes from values.instruction below instead, which
      # is the change that makes it tunable per bundle.
      text_extensions: []
      default_text: ${values.instruction}

  sink:
    key: RecordsSink
    config:
      format: jsonl/per-request

nodes:
  splitter:
    key: SplitterNode

  video_reader:
    key: VideoReaderNode
    config:
      max_frames: ${values.max_frames}
      size: ${values.size}
      batch_size: ${values.reader_batch_size}

  video_preprocessor:
    key: VideoPreprocessorNode
    config:
      batch_size: ${values.preprocessor_batch_size}
      batching_delay_ms: ${values.preprocessor_batching_delay_ms}
      patch_size: ${values.preprocessor_patch_size}
      merge_size: ${values.preprocessor_merge_size}
      temporal_patch_size: ${values.preprocessor_temporal_patch_size}
      image_mean: ${values.preprocessor_image_mean}
      image_std: ${values.preprocessor_image_std}
      rescale_factor: ${values.preprocessor_rescale_factor}
      min_pixels: ${values.preprocessor_min_pixels}
      max_pixels: ${values.preprocessor_max_pixels}

  audio_reader:
    key: AudioReaderNode

  whisper:
    key: WhisperModelNode
    config:
      model: ${models.whisper}

  prompt:
    key: ManualGenerationPromptGeneratorNode

  # The only node whose config differs from canonical `mga`. Everything after
  # `model` is new, and everything after `max_new_tokens` is the unverified set
  # described in the header — drop those five if the node rejects them.
  fusion:
    key: NewtonFusionModelNode
    config:
      model: ${models.fusion}
      max_new_tokens: ${values.max_new_tokens}
      temperature: ${values.temperature}
      repetition_penalty: ${values.repetition_penalty}
      top_k: ${values.top_k}
      top_p: ${values.top_p}
      enable_thinking: ${values.enable_thinking}

  parser:
    key: ManualGenerationResultsParserNode
    config:
      compute_stats: ${values.parser_compute_stats}
      output_frame_indices: ${values.parser_output_frame_indices}

graph:
  edges:
    - { from: source.text, to: prompt.instruction }
    - { from: source.video, to: splitter.in }
    - { from: splitter.left, to: video_reader.in }
    - { from: splitter.right, to: audio_reader.in }
    - { from: video_reader.out, to: video_preprocessor.in }
    - { from: audio_reader.out, to: whisper.in }
    - { from: video_preprocessor.out, to: prompt.video }
    - { from: whisper.out, to: prompt.audio }
    - { from: prompt.out, to: fusion.in }
    - { from: fusion.out, to: parser.in }
    - { from: parser.out, to: sink.in }

artifacts:
  "newton-fusion:1.0": "s3://atai-marketplace-model-depot/newton/f1_0_35b_a3b_fp8_base_040625b4d0750b"
  "whisper:large-v3": "s3://atai-marketplace-model-depot/whisper/large-v3"
